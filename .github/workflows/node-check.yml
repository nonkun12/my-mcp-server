name: Node Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check index.js
          node --check database.js
          node --check delete-reminder.js
          find tools -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

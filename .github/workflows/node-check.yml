name: Node Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit details (diagnostic only)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            const vulnerabilities = report.vulnerabilities ?? {};
            const entries = Object.entries(vulnerabilities);
            console.log("npm audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of entries) {
              const via = (item.via ?? []).map(v => typeof v === "string" ? v : (v.title + (v.url ? " [" + v.url + "]" : "")));
              console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via }));
            }
          '
      - name: Preview non-breaking audit remediation (dry run only)
        run: |
          npm audit fix --dry-run --json > "$RUNNER_TEMP/npm-audit-fix-preview.json" 2> "$RUNNER_TEMP/npm-audit-fix-preview.stderr" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const p = process.env.RUNNER_TEMP + "/npm-audit-fix-preview.json";
            const raw = fs.readFileSync(p, "utf8").trim();
            if (!raw) {
              console.log("Audit remediation preview returned no JSON; inspect npm output without applying changes.");
              process.exit(0);
            }
            try {
              const report = JSON.parse(raw);
              console.log("audit fix dry-run summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
              console.log("audit fix dry-run top-level keys:", Object.keys(report).join(", "));
              console.log("audit fix dry-run changes:", JSON.stringify({ added: report.added, removed: report.removed, changed: report.changed, audited: report.audited }));
            } catch {
              console.log("Audit remediation preview output was not JSON; no changes were applied.");
            }
          '
          echo "npm audit fix preview is diagnostic only; package files are not changed by this step."
      - name: Syntax check
        run: |
          node --check index.js
          node --check database.js
          node --check delete-reminder.js
          node --check review-endpoint.js
          find tools -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --test review-endpoint.test.js
